[project]
name = "kairos"
version = "0.1.0"
description = "个人工作与生活 agent 助手，也是一个从零学习 agent 开发的项目"
readme = "README.md"
authors = [
    { name = "Austinenna", email = "218343644+Austinenna@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.12.1",
    "croniter>=6.2.4",
    "cryptography>=50.0.2",
    "openai>=3.24.0",
    "pillow>=12.0.0",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
]

[project.scripts]
kairos = "kairos:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairos", "src/kairos_todo"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
